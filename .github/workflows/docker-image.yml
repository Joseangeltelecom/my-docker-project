name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login in DockerHub.
      uses: docker/login-action@v2
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build the Docker image
      run: docker build -f ./Dockerfile -t "${{ vars.DOCKER_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}" .

    - name: Push to Docker Hub
      run: |
        docker push "${{ vars.DOCKER_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}"

    - name: Run container
      run: |
        docker run -d --name "${{ vars.CONTAINER_NAME }}" -p 8080:8080 "${{ vars.DOCKER_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}"

    - name: Wait for container startup
      run: |
        echo "Waiting for container to start..."
        sleep 20
        docker ps

    - name: Test container response
      shell: bash
      run: |
        echo "Testing /health endpoint for expected response..."
        RESPONSE=$(curl -s http://localhost:8080/health)
        echo "Response: $RESPONSE"
        echo "$RESPONSE" | grep '"status":"OK"' && echo "$RESPONSE" | grep "Hello, CI Pipeline!"

    - name: Save container logs
      if: always()
      run: |
        docker logs "${{ vars.CONTAINER_NAME }}" > container-logs.txt

    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: container-logs
        path: container-logs.txt

    - name: Stop and remove container
      if: always()
      run: |
        echo "Cleaning up..."
        docker stop "${{ vars.CONTAINER_NAME }}"
        docker rm "${{ vars.CONTAINER_NAME }}"
        docker rmi "${{ vars.DOCKER_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}"